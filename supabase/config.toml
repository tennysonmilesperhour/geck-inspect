project_id = "geck-inspect"

# RevenueCat authenticates using its configured shared Authorization header.
# The Supabase JWT gateway must let that header reach our handler.
[functions.revenuecat-webhook]
verify_jwt = false

# Purchase/restore sync authenticates the user again in the handler and derives
# the customer UUID from that session, never from a request body.
[functions.revenuecat-sync]
verify_jwt = true

# Account erasure. Every caller is a signed-in admin, so the gateway rejects
# anonymous calls; the handler then checks the admin role itself.
[functions.admin-delete-account]
verify_jwt = true

# The member deletes their own account from Settings. The gateway requires a
# session; the handler erases only the user on that session.
[functions.delete-my-account]
verify_jwt = true

# "Use my existing account" on the Add your email screen. The gateway
# requires a session; the handler deletes only the caller, and only when
# that login is an empty social sign-in (no email, no phone).
[functions.discard-empty-account]
verify_jwt = true

# Public waitlist signups and confirmation links. Buyers are signed out,
# so the gateway lets anonymous calls through; the handler only acts
# through service-role database functions and mails addresses read from
# the database.
[functions.waitlist-signup]
verify_jwt = false

# One-click unsubscribe from notification emails. Mail apps POST here with
# no Supabase session; the signed token in the URL is the proof.
[functions.email-unsubscribe]
verify_jwt = false

# The functions below were deployed by hand until 15 October 2026, so their
# gateway setting lived only in the deploy command. Declaring them here
# records that setting in the repo and lets the Supabase GitHub integration
# deploy them from main, the same way it deploys the functions above.
# Each value matches what production had on 15 October 2026.

# Stripe signs its webhook calls; the handler checks the Stripe-Signature
# header with the signing secret. Stripe sends no Supabase session.
[functions.stripe-webhook]
verify_jwt = false

# Promote drafting. Members only; the handler meters each draft against the
# member's monthly allowance.
[functions.generate-social-post]
verify_jwt = true

# AI health screen. Members only; the handler charges and refunds the
# member's health-screen credit.
[functions.health-screen]
verify_jwt = true

# Called by the notifications database trigger with a dispatch secret, which
# the handler checks against verify_notification_dispatch_secret().
[functions.send-email]
verify_jwt = false

# Collection invites. The handler reads the caller's session itself and
# takes the inviter's name from their profile.
[functions.send-collection-invite]
verify_jwt = false

# Public "send me the guides" form on the landing page. Signed-out visitors
# use it; the handler rate-limits by network and never clears an
# unsubscribe.
[functions.subscribe-and-send-guides]
verify_jwt = false

# Public Weekly Gecko Notes form on the guide pages, for visitors without
# an account. Signed-out visitors use it; the database step rate-limits by
# address and network, and nothing is added until the emailed link is
# pressed.
[functions.subscribe-weekly-notes]
verify_jwt = false

# Public breeder inquiry form. Signed-out buyers use it; the handler
# rate-limits by network.
[functions.send-breeder-inquiry]
verify_jwt = false

# Morph ID. Guests get a limited try; the handler reads the session itself
# when there is one and meters signed-in members.
[functions.recognize-gecko-morph]
verify_jwt = false

# Resend's delivery webhooks (delivered, opened, bounced, complained).
# Resend has no Supabase session; the handler checks the Svix signature
# against RESEND_WEBHOOK_SECRET and refuses everything else.
[functions.resend-webhook]
verify_jwt = false

# Declared on 16 October 2026 after comparing each function's deployed
# code with the repo copy (read from production, file by file). Each one
# below matched what runs, or differed only in comments, so the first
# deploy from main changes no behaviour. verify_jwt is the value production
# had that day. Two hand-deployed functions are left out on purpose:
# embed-gecko-image and export-training-corpus, whose repo copies are newer
# than what runs (see docs/INFRASTRUCTURE.md); rapid-api and
# admin-end-trial are being deleted.

# Membership page checkout. A signed-in member; the handler checks the
# tier, cycle, price id and return address itself.
[functions.stripe-checkout]
verify_jwt = true

# "Manage billing" on the Membership page. A signed-in member; the handler
# opens Stripe's portal for the caller's own customer only.
[functions.stripe-billing-portal]
verify_jwt = true

# Web push for every new notification. Called by the notifications
# database trigger with the dispatch secret (or by server code with the
# service-role key); the handler checks the bearer itself.
[functions.send-push]
verify_jwt = false

# Browsers post Content-Security-Policy reports here with no session. The
# handler only accepts reports for geckinspect.com pages and throttles.
[functions.csp-report]
verify_jwt = false

# Daily collection value. pg_cron calls it through
# request_market_value_snapshot() with the dispatch secret; the handler
# checks it. It also bundles src/lib/traitValuation.js and quality.js.
[functions.market-value-snapshot]
verify_jwt = false

# Admin tools and the GeckoGenius assistant. A signed-in member; the
# handler meters members through consume_feature_credit.
[functions.invoke-llm]
verify_jwt = true

# AI image import (notecards, screenshots). A signed-in Breeder or
# Enterprise member; the handler meters each scan.
[functions.recognize-import-data]
verify_jwt = true

# Enclosure sensor reads (switched off in the app). A signed-in member; the
# handler meters each read.
[functions.iot-poll]
verify_jwt = true

# Promote (retired in the app, kept for existing drafts). Publishing,
# saving a platform connection and starting a Meta or Reddit sign-in need
# a signed-in member. The two callbacks are opened by Meta's and Reddit's
# redirect, which carries no session, so the handler checks the signed
# state instead. The overage report is the monthly job (or an admin) with
# the dispatch secret, checked by the handler.
[functions.publish-social-post]
verify_jwt = true

[functions.set-platform-connection]
verify_jwt = true

[functions.meta-oauth-start]
verify_jwt = true

[functions.meta-oauth-callback]
verify_jwt = false

[functions.reddit-oauth-start]
verify_jwt = true

[functions.reddit-oauth-callback]
verify_jwt = false

[functions.report-social-overage]
verify_jwt = false

# MorphMarket store verification. Members only; the handler reads the
# session itself and only changes the caller's own row.
[functions.verify-morphmarket-store]
verify_jwt = true
