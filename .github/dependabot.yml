version: 2
updates:
  # pnpm lockfiles are updated through the npm ecosystem.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # typescript5 is TypeScript 5 kept for its compiler API, which the
      # edge function tests use; TypeScript 7 does not have one yet.
      - dependency-name: typescript5
        update-types: ["version-update:semver-major"]
      # @vercel/og 1.0.3 makes every Vercel deploy fail at "Deploying
      # outputs": "The Edge Function middleware is referencing unsupported
      # modules: @vercel". The middleware never imports it, and GitHub CI
      # passes, so only the Vercel deploy shows the failure. Seen on 24 Oct
      # 2026 in the npm-minor-and-patch group update. Before lifting this,
      # bump it alone and check that the Vercel preview deploy is Ready.
      - dependency-name: "@vercel/og"
        versions: [">1.0.1"]
      # Radix stays where it is until touch dismissal is fixed upstream.
      # @radix-ui/react-dismissable-layer 1.2 stopped waiting for the click
      # on touch screens unless a component opts back in. Dialog and Popover
      # do; Menu 2.2 (DropdownMenu) and Select 2.4 do not. On a phone, a tap
      # outside an open select or menu then also presses whatever is under
      # the finger (for example a Save button). Found on 24 Oct 2026 in the
      # npm-minor-and-patch group update; GitHub CI does not catch it. The
      # updates are also over the startup size budget unless all Radix
      # packages move together. Before lifting this, check that Menu and
      # Select pass deferPointerDownOutside, then tap outside an open select
      # in GeckoForm on a real phone.
      - dependency-name: "@radix-ui/*"
      # Tailwind CSS 4 is a rewrite (CSS-first configuration, colours in
      # oklch). #151 failed on 22 to 24 Oct 2026: the colour contrast tests
      # read tailwindcss/colors as hex and got NaN, and the browser member
      # flow failed. It would also restyle both arms of the homepage A/B
      # test, which are frozen while it runs
      # (docs/planning/homepage-ab-test-2026-10.md). Moving to 4 is its own
      # project: port tailwind.config.js, then check every page by eye.
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      # Vite 8 bundles with Rolldown. #158 failed on 24 Oct 2026 at
      # pnpm build: the chunk naming function in vite.config.js calls
      # getModuleIds, which Rolldown's chunk info does not provide, and
      # those rules are what keep the startup script under its 150 kB
      # budget. Moving needs them rewritten for Rolldown and the size
      # budget checked again.
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
    groups:
      # lucide-react gets its own pull request. Production builds rewrite
      # lucide's icon files (scripts/vite-plugins/lean-lucide-icons.mjs), so
      # a lucide release that changes their format fails CI on purpose.
      # Kept apart, that failure holds up only lucide, not every other minor
      # and patch update. A dependency goes to the first group it matches.
      lucide:
        patterns:
          - lucide-react
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions-minor-and-patch:
        update-types:
          - minor
          - patch
