name: CI

# Quality gates for pushes to main (which deploys to production via
# Vercel). Keeps the gates that the June 2026 audit got green from
# silently regressing: lint (0 errors), typecheck (syntax gate), and
# the full build including prerender + strict SEO audit.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Genetics drift check
        run: node scripts/check-genetics-consistency.mjs

      # Build runs the non-strict SEO audit (scripts/seo-audit.mjs) as its
      # last step, matching what Vercel runs on deploy. The STRICT audit
      # is intentionally NOT a per-push gate: it fails on content-only
      # issues (a stale dateModified, a new route with no inbound links)
      # that should not block a code deploy. It runs on a schedule instead
      # (see .github/workflows/seo-audit-weekly.yml).
      - name: Build (sitemap, llms, vite, prerender, SEO audit)
        run: pnpm build

      # Fails when the main script plus what it loads up front passes
      # 150 kB gzipped, a page's own script passes 60 kB, a public page
      # passes 200 kB before it can draw, or an image in public/ passes
      # 200 KB. Things already over on 16 Oct 2026 have allowances at that
      # size (scripts/bundle-budget.json says how to tighten them). The
      # step prints every size it checks, so the log shows what grew.
      - name: Size budget
        run: node scripts/check-bundle-size.mjs
