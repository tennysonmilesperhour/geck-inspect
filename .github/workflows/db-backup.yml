# Weekly encrypted logical backup of the Supabase Postgres database.
#
# The plaintext dump is piped straight into gpg. It is never written to
# disk and never uploaded. Only backup.dump.gpg is kept, as an Actions
# artifact for 30 days.
#
# This repo is public. Artifacts are visible to collaborators, which is
# why the file is encrypted. Add both secrets before relying on this job.
# Until they are set, the job prints a notice and exits 0.

name: Weekly database backup

on:
  schedule:
    # Sundays at 10:00 UTC.
    - cron: "0 10 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Dump and encrypt
        id: dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL}" ] || [ -z "${BACKUP_PASSPHRASE}" ]; then
            echo "::notice::Database backups are skipped until both secrets SUPABASE_DB_URL and BACKUP_PASSPHRASE are set."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Secrets are already masked. Also mask a password split out of
          # the URL, because pg_dump can log that piece on its own.
          echo "::add-mask::${SUPABASE_DB_URL}"
          echo "::add-mask::${BACKUP_PASSPHRASE}"
          rest="${SUPABASE_DB_URL#*://}"
          userinfo="${rest%%@*}"
          if [ "$userinfo" != "$rest" ] && [ "${userinfo#*:}" != "$userinfo" ]; then
            echo "::add-mask::${userinfo#*:}"
          fi

          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          pg_dump --version

          # Custom format on stdout, including every schema the role can
          # see (public and geck_data). gpg reads that stream on stdin.
          pg_dump "$SUPABASE_DB_URL" --format=custom --no-owner --no-privileges \
            | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
                --symmetric --cipher-algo AES256 -o backup.dump.gpg \
                3<<<"$BACKUP_PASSPHRASE"

          bytes=$(stat -c '%s' backup.dump.gpg)
          hash=$(sha256sum backup.dump.gpg | awk 'NR==1 { print $1 }')
          echo "Encrypted backup size: ${bytes} bytes"
          echo "Encrypted backup sha256: ${hash}"
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          echo "name=db-backup-$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Upload encrypted backup
        if: steps.dump.outputs.skipped != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.dump.outputs.name }}
          path: backup.dump.gpg
          retention-days: 30
          if-no-files-found: error
