# Push published URLs to IndexNow (Bing / Yandex / Seznam / DuckDuckGo).
#
# The old Google and Bing sitemap "ping" endpoints were both retired, so
# IndexNow is the current way to actively notify engines of new/changed
# URLs instead of waiting for them to recrawl. A single POST covers Bing,
# Yandex, Seznam, and DuckDuckGo.
#
# Runs after a change to the sitemap lands on main (the deploy that ships
# the new URLs goes out on the same push), and can be triggered by hand.
# GitHub-hosted runners have outbound network, which the sandbox does not,
# so submission has to happen here rather than from a local session.
#
# Google is intentionally not covered: it only accepts sitemaps through
# Search Console now (one-time human OAuth step). Google auto-discovers our
# sitemap from the Sitemap: line in robots.txt, so nothing per-deploy is
# needed on that side.

name: indexnow-submit

on:
  push:
    branches: [main]
    paths:
      - 'public/sitemap.xml'
      - 'scripts/submit-indexnow.mjs'
  workflow_dispatch:

concurrency:
  group: indexnow-submit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      # Give the just-pushed deploy a moment to go live so the submitted
      # URLs resolve when the engines verify them.
      - name: Wait for deploy to propagate
        run: sleep 90

      - name: Submit sitemap URLs to IndexNow
        run: node scripts/submit-indexnow.mjs
